name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test bridge
        run: python -m unittest discover -s tests/python -v
      - name: Download verified Ghidra
        run: python scripts/download_ghidra.py "$RUNNER_TEMP/ghidra"
      - name: Build extension
        run: python scripts/build.py --ghidra-home "$RUNNER_TEMP/ghidra/ghidra_12.2_PUBLIC"
      - name: Prepare analyzed fixture project
        run: >-
          python scripts/prepare_test_project.py
          --ghidra-home "$RUNNER_TEMP/ghidra/ghidra_12.2_PUBLIC"
          --output-dir "$RUNNER_TEMP/ghidra-fixtures"
      - name: Test against Ghidra runtime
        run: >-
          python scripts/run_ghidra_tests.py
          --ghidra-home "$RUNNER_TEMP/ghidra/ghidra_12.2_PUBLIC"
          --project "$RUNNER_TEMP/ghidra-fixtures/projects/FixtureProject.gpr"
          --smoke ResearchSmoke MutationSmoke AnalysisSmoke ProjectSmoke
          --output-dir "$RUNNER_TEMP/ghidra-tests"
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-runtime-tests
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/ghidra-fixtures/*.log
            ${{ runner.temp }}/ghidra-fixtures/fixture.json
            ${{ runner.temp }}/ghidra-tests/results.json
            ${{ runner.temp }}/ghidra-tests/*/console.log
            ${{ runner.temp }}/ghidra-tests/*/report.json
      - name: Assemble release
        run: python scripts/package_release.py --output-dir release
      - uses: actions/upload-artifact@v4
        with:
          name: GhidraMCP-12.2
          path: release/
